workflows:
  marlon-panel-ios:
    name: MARLON PANEL PRO iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build iOS without signing
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/MarlonPanelPRO.xcodeproj" \
            -scheme "MarlonPanelPRO" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=YES \
            build

      - name: Package unsigned IPA
        script: |
          APP="$CM_BUILD_DIR/build/Build/Products/Debug-iphoneos/MarlonPanelPRO.app"
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -r "$CM_BUILD_DIR/MARLON_PANEL_PRO.ipa" Payload

    artifacts:
      - MARLON_PANEL_PRO.ipa
      - /tmp/xcodebuild_logs/*.log
